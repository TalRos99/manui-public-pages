<!doctype html>
<!--
  Manui download link. Sends iPhones/iPads to the App Store and Android
  phones to Google Play (store searches for "manui" until the app has
  listings); anything else gets both buttons. Once hosted, regenerate the
  sample pass with its URL:
    python3 .maestro/tools/make_wallet_screenshot.py --download-url <url>
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Manui</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
      }
      a {
        display: block;
        margin: 12px auto;
        padding: 14px 24px;
        max-width: 240px;
        border-radius: 12px;
        background: #111;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
    <script>
      (function () {
        var APP_STORE = 'https://apps.apple.com/search?term=manui';
        var GOOGLE_PLAY = 'https://play.google.com/store/search?q=manui&c=apps';
        var ua = navigator.userAgent || '';
        // iPadOS reports itself as a Mac; touch support tells them apart.
        var ios =
          /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (ios) location.replace(APP_STORE);
        else if (/Android/.test(ua)) location.replace(GOOGLE_PLAY);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Get Manui</h1>
      <a href="https://apps.apple.com/search?term=manui">App Store</a>
      <a href="https://play.google.com/store/search?q=manui&amp;c=apps">Google Play</a>
    </main>
  </body>
</html>
